[project]
name = "signal-check"
version = "0.1.0"
description = "Signal Check: a tool-calling agent that checks drug side-effect worries against openFDA reports and FDA labels"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "requests>=2.31",
]
